<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revisão HTML, CSS, JS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Revisão HTML, CSS, JS</h1>
<main>
    <div class="wrap-inputs">
        <label for="nome">Nome:</label>
        <input id="nome" type="text" placeholder="insira seu nome">
    </div>

    <div class="wrap-inputs">
        <label for="nota1">Nota1</label>
        <input id="nota1" type="number" placeholder="insira a segunda nota">
    </div>

    <div class="wrap-inputs">
        <label for="nota2">Nota2</label>
        <input id="nota2" type="number" placeholder="insira a terceira nota">
    </div>

    <div class="wrap-inputs">
        <label for="nota3">Nota3</label>
        <input id="nota3" type="number" placeholder="insira a quarta nota">
    </div>

    <button onclick="calcularMedia()">Calcular Média</button>

    </main>    
    <p id="resultado"></p>
    <script src="script.js"></script>
</body>
</html>
